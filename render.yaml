services:
  - type: web
    name: alm-mcp-server
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: ALM_BASE_URL
        value: https://learningmanager.adobe.com
      - key: ALM_ACCESS_TOKEN
        sync: false
